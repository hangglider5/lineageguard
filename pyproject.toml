[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lineageguard"
version = "0.1.0"
description = "A DataHub-native agent for validated schema-change impact analysis."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "Apache-2.0"
dependencies = [
  "acryl-datahub==1.6.0",
  "fastmcp==3.4.4",
  "mcp==1.28.1",
  "mcp-server-datahub==0.6.0",
  "starlette==1.3.1",
  "uvicorn==0.51.0",
]

[project.scripts]
lineageguard-probe-mcp = "lineageguard.mcp_probe:main"
lineageguard-run = "lineageguard.workflow:main"
lineageguard-eval = "lineageguard.evaluation:main"
lineageguard-live-eval = "lineageguard.live_evaluation:main"
lineageguard-demo-api = "lineageguard.demo_api:main"
lineageguard-submission-gate = "lineageguard.submission_gate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lineageguard = ["demo_scenario.json", "static/*"]
