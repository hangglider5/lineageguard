name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-validation:
    name: Offline validation (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable .

      - name: Run deterministic CI gate
        run: ./scripts/ci.sh

  container-smoke:
    name: Container smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate deployment configuration
        env:
          DATAHUB_GMS_URL: https://datahub.example.com
          DATAHUB_GMS_TOKEN: ci-non-secret-placeholder
        run: docker compose -f deploy/compose.demo.yml config --quiet

      - name: Build demo image
        run: docker build --tag lineageguard-demo:ci .

      - name: Verify non-root demo surface
        run: |
          container_id="$(docker run --rm --detach \
            --publish 127.0.0.1:8000:8000 \
            --env DATAHUB_GMS_URL=https://datahub.example.com \
            --env DATAHUB_GMS_TOKEN=ci-non-secret-placeholder \
            lineageguard-demo:ci)"
          trap 'docker stop "$container_id"' EXIT
          test "$(docker inspect --format '{{.Config.User}}' "$container_id")" = "10001:10001"
          if ! curl --fail --silent --show-error \
            --connect-timeout 2 --max-time 5 \
            --retry 20 --retry-delay 1 --retry-max-time 30 \
            --retry-all-errors \
            http://127.0.0.1:8000/health; then
            docker logs "$container_id"
            exit 1
          fi
          curl --fail --silent --show-error http://127.0.0.1:8000/ \
            | python3 -c 'import sys; assert "LineageGuard" in sys.stdin.read()'
          curl --fail --silent --show-error http://127.0.0.1:8000/assets/demo.css \
            | python3 -c 'import sys; assert "--blue: #075ee6" in sys.stdin.read()'
